[platformio]
default_envs = ai-thinker-esp32-cam
src_dir = src
include_dir = include
test_dir = test

[env:ai-thinker-esp32-cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32cam
framework = arduino
test_build_src = no

; This release carries Arduino-ESP32 3.0.7 and its ESP-IDF 5.x watchdog API.
; Keep the release asset pinned together with the board definition.
board_build.partitions = partitions_no_ota.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSAHL_PRODUCTION=0
    -DSAHL_REQUIRE_FLASH_ENCRYPTION=1
    -DSAHL_REQUIRE_AUTHENTICATED_TIME=1

[env:ai-thinker-esp32-cam-production]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32cam
framework = arduino
test_build_src = no

board_build.partitions = partitions_no_ota.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSAHL_PRODUCTION=1
    -DSAHL_REQUIRE_FLASH_ENCRYPTION=1
    -DSAHL_REQUIRE_AUTHENTICATED_TIME=1
