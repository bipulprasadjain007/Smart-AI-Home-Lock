[platformio]
default_envs = ai-thinker-esp32-cam
src_dir = src
include_dir = include
test_dir = test

[env:ai-thinker-esp32-cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
test_build_src = no

; espressif32 6.9.0 carries Arduino-ESP32 2.0.17. Keep the platform pin
; together with the board definition so a firmware build is reproducible.
board_build.partitions = partitions_no_ota.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSAHL_PRODUCTION=0
    -DSAHL_REQUIRE_FLASH_ENCRYPTION=1
    -DSAHL_REQUIRE_AUTHENTICATED_TIME=1

[env:ai-thinker-esp32-cam-production]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
test_build_src = no

board_build.partitions = partitions_no_ota.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSAHL_PRODUCTION=1
    -DSAHL_REQUIRE_FLASH_ENCRYPTION=1
    -DSAHL_REQUIRE_AUTHENTICATED_TIME=1
