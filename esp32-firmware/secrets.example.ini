# This file is a provisioning template only. It is not read by firmware and
# must never be filled with production credentials in the repository.
# Use the serial NVS interface described in README.md instead.
# The default firmware is development-only; NVS does not protect production
# secrets. Production builds require the explicit security gates in config.h.

DEVICE_ID=<v2-id-matching-[A-Za-z0-9][A-Za-z0-9_-]{0,63}>
WIFI_SSID=<wifi-ssid>
WIFI_PASSWORD=<wifi-password-or-empty-for-open-network>
ENDPOINT_HOST=<tls-hostname-without-https-or-path>
ENDPOINT_PORT=443
CA_CERT=<PEM-certificate-with-\\n-for-newlines>
AES_KEY_HEX=<64-hex-characters-from-secret-storage>
HMAC_KEY_HEX=<64-hex-characters-from-secret-storage>
RELAY_ACTIVE_HIGH=1
RELAY_PULSE_MS=750
